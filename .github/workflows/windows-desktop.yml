name: Windows desktop

# Every pushed commit produces an inspectable NSIS artifact. A version tag
# publishes the same updater metadata to GitHub Releases, which is the feed
# consumed by electron-updater in installed builds.
on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  installer:
    name: NSIS x64 installer
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}\setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'
          architecture: x64

      - name: Install (immutable)
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Build application
        shell: pwsh
        env:
          DSH_BUILD_CLIENT_PROFILE: official
        run: pnpm run build:official

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $expected = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Desktop release tag must be $expected, received $env:GITHUB_REF_NAME"
          }

      - name: Build and smoke bundled Windows-MCP runtime
        shell: pwsh
        run: ./scripts/build-windows-mcp-runtime.ps1

      - name: Build NSIS installer
        shell: pwsh
        env:
          # electron-builder signs automatically when these optional repository
          # secrets are present; unsigned fork builds remain installable but may
          # trigger Windows SmartScreen until a certificate is configured.
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: pnpm --filter @deepseek-ai/dsh-desktop run package:win

      - name: Verify packaged payload
        shell: pwsh
        run: pnpm run verify-desktop-payload

      - name: Smoke packaged desktop startup and directory browser
        shell: pwsh
        run: |
          $executable = Resolve-Path 'apps/desktop/release/win-unpacked/DSH Teacher.exe'
          $smokeData = Join-Path $env:RUNNER_TEMP 'dsh-desktop-smoke'
          $stdout = Join-Path $smokeData 'stdout.log'
          $stderr = Join-Path $smokeData 'stderr.log'
          New-Item -ItemType Directory -Path $smokeData -Force | Out-Null
          $desktop = Start-Process -FilePath $executable `
            -ArgumentList "--user-data-dir=$smokeData" `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -PassThru
          $ready = $false
          $lastTitle = ''
          try {
            $deadline = (Get-Date).AddSeconds(60)
            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Milliseconds 500
              $desktop.Refresh()
              if ($desktop.HasExited) {
                throw "Packaged desktop exited before opening its main window (exit $($desktop.ExitCode))"
              }
              $lastTitle = $desktop.MainWindowTitle
              if ($lastTitle -eq 'DeepSeek Harness') {
                $ready = $true
                break
              }
            }
            if (-not $ready) {
              throw "Packaged desktop did not open the DeepSeek Harness window within 60 seconds (last title: '$lastTitle')"
            }

            $mainLog = Join-Path $smokeData 'logs/main.log'
            $launchUrl = $null
            $deadline = (Get-Date).AddSeconds(15)
            while ((Get-Date) -lt $deadline) {
              if (Test-Path $mainLog) {
                $match = [regex]::Match(
                  (Get-Content $mainLog -Raw),
                  'dsh web: (http://127\.0\.0\.1:\d+/\?token=[A-Za-z0-9_-]+)'
                )
                if ($match.Success) {
                  $launchUrl = $match.Groups[1].Value
                  break
                }
              }
              Start-Sleep -Milliseconds 250
            }
            if ($null -eq $launchUrl) {
              throw 'Packaged desktop did not report its authenticated backend URL'
            }

            $backendUrl = ([uri]$launchUrl).GetLeftPart([System.UriPartial]::Authority)
            $handler = [System.Net.Http.HttpClientHandler]::new()
            $handler.AllowAutoRedirect = $false
            $handler.UseProxy = $false
            $client = [System.Net.Http.HttpClient]::new($handler)
            try {
              $exchange = $client.GetAsync($launchUrl).GetAwaiter().GetResult()
              if ([int]$exchange.StatusCode -ne 303) {
                throw "Packaged desktop token exchange returned HTTP $([int]$exchange.StatusCode)"
              }
              $setCookie = @($exchange.Headers.GetValues('Set-Cookie'))[0]
              $cookie = $setCookie.Split(';')[0]
            } finally {
              $client.Dispose()
              $handler.Dispose()
            }

            $request = @{
              type = 'client-request'
              rpcId = '00000000-0000-4000-8000-000000000005'
              method = 'directoryPicker/list'
              payload = @{ args = @{} }
            } | ConvertTo-Json -Compress
            $listing = Invoke-RestMethod `
              -Method Post `
              -Uri "$backendUrl/api/directoryPicker/list" `
              -Headers @{ Origin = $backendUrl; Cookie = $cookie } `
              -ContentType 'application/json' `
              -Body $request `
              -NoProxy
            if (-not $listing.result.ok) {
              throw "Packaged desktop directory browser failed: $($listing.result.error | ConvertTo-Json -Compress)"
            }
            if ([string]::IsNullOrWhiteSpace($listing.result.value.path) -or
                [string]::IsNullOrWhiteSpace($listing.result.value.home)) {
              throw 'Packaged desktop directory browser returned an invalid listing'
            }
          } catch {
            $logs = @(
              (Join-Path $smokeData 'logs/main.log'),
              $stdout,
              $stderr
            )
            foreach ($log in $logs) {
              if (Test-Path $log) {
                Write-Host "== $log =="
                Get-Content $log | ForEach-Object {
                  $_ -replace '([?&]token=)[A-Za-z0-9_-]+', '$1<redacted>'
                }
              }
            }
            throw
          } finally {
            if (-not $desktop.HasExited) {
              if (-not $desktop.CloseMainWindow() -or -not $desktop.WaitForExit(15000)) {
                Stop-Process -Id $desktop.Id -Force -ErrorAction SilentlyContinue
              }
            }
          }

      - name: Verify update assets and write checksums
        shell: pwsh
        run: |
          $release = Join-Path $PWD 'apps/desktop/release'
          $installer = Get-ChildItem $release -File -Filter '*.exe'
          $metadata = Get-ChildItem $release -File -Filter '*.yml'
          if ($installer.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installer.Count)"
          }
          if (-not ($metadata.Name -contains 'latest.yml')) {
            throw 'electron-builder did not emit latest.yml'
          }
          $lines = $installer | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          Set-Content (Join-Path $release 'SHA256SUMS.txt') $lines -Encoding utf8NoBOM

      - uses: actions/upload-artifact@v7
        with:
          name: DSH-Teacher-Windows-x64-${{ github.sha }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/*.yml
            apps/desktop/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release update feed
    if: startsWith(github.ref, 'refs/tags/')
    needs: installer
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: DSH-Teacher-Windows-x64-${{ github.sha }}
          path: apps/desktop/release

      - name: Publish updater assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $assets = Get-ChildItem apps/desktop/release -File |
            Where-Object { $_.Extension -in '.exe', '.blockmap', '.yml', '.txt' } |
            ForEach-Object { $_.FullName }
          & gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            & gh release upload $tag @assets --clobber
          } else {
            $arguments = @('release', 'create', $tag) + $assets + @(
              '--verify-tag',
              '--title', "DSH Teacher $version",
              '--generate-notes'
            )
            if ($version.Contains('-')) { $arguments += '--prerelease' }
            & gh @arguments
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed' }

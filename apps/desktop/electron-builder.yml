appId: ai.deepseek.dsh.teacher
productName: DSH Teacher
asar: false
directories:
  output: release
files:
  - lib/**/*
  - package.json
  - '!**/*.map'
  - '!**/*.tsbuildinfo'
extraResources:
  - from: ../../THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: ../../packages/host/teacher-workbench/third-party/mathml2omml
    to: licenses/mathml2omml
    filter:
      - '**/*'
  - from: build/icon.ico
    to: icon.ico
# Shipped addons use Node-API prebuilds; verify:runtime tests them in Electron.
npmRebuild: false
afterPack: ./scripts/after-pack.mjs
generateUpdatesFilesForAllChannels: true
win:
  executableName: DSH Teacher
  icon: build/icon.ico
  artifactName: DSH-Teacher-${version}-${arch}-Setup.${ext}
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: DSH Teacher
  deleteAppDataOnUninstall: false
  # NSIS's separate precompressed-file copier skips node_modules.
  # Keep dependency assets in the ordinary application archive.
  preCompressedFileExtensions: []
publish:
  provider: github
  owner: wsl189
  repo: dsh-teacher

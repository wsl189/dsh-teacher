packages:
  - vendor/*
  - packages/*/*
  # The Landlock launcher is developed with its harness consumers but keeps
  # its native build and publication scripts under native/landlock-run.
  - native/landlock-run
  - native/landlock-run/packages/*
  # Product assemblies over the package tier; apps/cli owns the `dsh` bin.
  - apps/*
  - website
  # Deploy root of the single-exe build: a pure dependency manifest whose
  # closure is what the exe bundles and what the Python runtime distributes.
  - python/sdk-runtime

# Vendored framework packages keep their upstream semver ranges, while local
# builds must resolve those matching names to this workspace's pinned sources.
linkWorkspacePackages: true

overrides:
  '@deepseek-ai/cosmokit': 'link:vendor/cosmokit'
  '@deepseek-ai/schemastery': 'link:vendor/schemastery'
  # AnySearch's pre-1.0 peers share the application's tested web/tool services.
  '@anysearch/anysearch-dsh>@deepseek-ai/dsh-credentials': 'link:packages/credentials/credentials'
  '@anysearch/anysearch-dsh>@deepseek-ai/dsh-system-prompt': 'link:packages/core/system-prompt'
  '@anysearch/anysearch-dsh>@deepseek-ai/dsh-settings': 'link:packages/settings/settings'
  '@anysearch/anysearch-dsh>@deepseek-ai/dsh-tool-web': 'link:packages/web/tool-web'
  '@anysearch/anysearch-dsh>@deepseek-ai/dsh-tools': 'link:packages/core/tools'
  '@anysearch/anysearch-dsh>@deepseek-ai/dsh-web': 'link:packages/web/web'
  # The bundled image studio resolves the selected typed supplier route at
  # request time instead of owning a second model-and-credential catalog.
  '@dickpy/dsh-imagegen>@deepseek-ai/dsh-agent-default-model': 'link:packages/core/agent-default-model'
  '@dickpy/dsh-imagegen>@deepseek-ai/dsh-credentials': 'link:packages/credentials/credentials'
  '@dickpy/dsh-imagegen>@deepseek-ai/dsh-model-service-settings': 'link:packages/settings/model-service-settings'
  # The bundled cron release pins the pre-ToolCallId tools package. Its public
  # defineTool use remains compatible with the current workspace implementation.
  'dsh-plugin-cron>@deepseek-ai/dsh-tools': 'link:packages/core/tools'
  # The bundled skill/MCP panel predates the current workspace versions but
  # consumes these stable runtime APIs; keep one first-party implementation in
  # the Web and Electron dependency closure.
  'dsh-skill-mcp-panel>@deepseek-ai/dsh-home-paths': 'link:packages/util/home-paths'
  'dsh-skill-mcp-panel>@deepseek-ai/dsh-subprocess': 'link:packages/subprocess/subprocess'
  'dsh-skill-mcp-panel>@deepseek-ai/dsh-typert-protocol': 'link:packages/typert/protocol'
  # Univer 0.2.12 declares pre-1.0 DSH peers. Its shipped-composition test
  # exercises the current implementations named here instead of installing a
  # second Host API spine beside the application.
  'dsh-univer-office>@deepseek-ai/dsh-attachment': 'link:packages/attachment/attachment'
  'dsh-univer-office>@deepseek-ai/dsh-host-webserver': 'link:packages/host/webserver'
  'dsh-univer-office>@deepseek-ai/dsh-llm': 'link:packages/llm/llm'
  'dsh-univer-office>@deepseek-ai/dsh-session': 'link:packages/core/session'
  'dsh-univer-office>@deepseek-ai/dsh-settings': 'link:packages/settings/settings'
  'dsh-univer-office>@deepseek-ai/dsh-skill': 'link:packages/skill/skill'
  'dsh-univer-office>@deepseek-ai/dsh-tools': 'link:packages/core/tools'
  # app-builder-lib 26.15.x reads the cache-mode enum introduced in 3.1.0,
  # but its ^3 range can preserve an older 3.0.0 lock without that export.
  'app-builder-lib>@electron/get': '3.1.0'

packageExtensions:
  # The reviewed AnySearch patch projects its editable subset through DSH settings.
  '@anysearch/anysearch-dsh@0.1.4':
    peerDependencies:
      '@deepseek-ai/dsh-settings': '>=1.0.9 <2'
  # The reviewed compatibility patch adds these runtime imports to the
  # upstream compiled Host bundle.
  '@dickpy/dsh-imagegen@1.5.1':
    peerDependencies:
      '@deepseek-ai/dsh-agent-default-model': '>=1.1.2 <2'
      '@deepseek-ai/dsh-credentials': '>=1.1.2 <2'
      '@deepseek-ai/dsh-model-service-settings': '>=1.1.2 <2'

peerDependencyRules:
  allowedVersions:
    '@anysearch/anysearch-dsh>@deepseek-ai/dsh-credentials': '>=1.0.7-rc3 <2'
    '@anysearch/anysearch-dsh>@deepseek-ai/dsh-system-prompt': '>=1.0.7-rc3 <2'
    '@anysearch/anysearch-dsh>@deepseek-ai/dsh-tool-web': '>=1.0.7-rc3 <2'
    '@anysearch/anysearch-dsh>@deepseek-ai/dsh-web': '>=1.0.7-rc3 <2'
    # Office 0.1.2 declares the original better-sidebar range, but its only
    # integration method, registerFileViewer(), is unchanged through 0.17 and is
    # exercised by the shipped-composition browser lane.
    dsh-better-sidebar: '>=0.6.0 <1'
    # Univer 0.2.12 consumes these stable DSH APIs through its direct Web-bundle
    # peers. The shipped-composition lane verifies the current 1.x providers.
    '@deepseek-ai/dsh-attachment': '>=0.1.1-rc.2 <2'
    '@deepseek-ai/dsh-host-webserver': '>=0.1.1-rc.2 <2'
    '@deepseek-ai/dsh-llm': '>=0.1.1-rc.2 <2'
    '@deepseek-ai/dsh-session': '>=0.1.1-rc.2 <2'
    '@deepseek-ai/dsh-settings': '>=0.1.1-rc.2 <2'
    '@deepseek-ai/dsh-skill': '>=0.1.1-rc.2 <2'
    '@deepseek-ai/dsh-tools': '>=0.1.1-rc.2 <2'
    typescript: '>=5 <7'

# pnpm 10+ blocks any dependency shipping an install/build script until it is
# explicitly reviewed here (strictDepBuilds defaults to true: an unlisted script
# is a hard install error). Every such package MUST be listed; we deny by
# default and only allow scripts we need. esbuild (native binary) and lefthook
# (git hooks) genuinely need theirs.
allowBuilds:
  esbuild: true
  # Electron downloads its reviewed platform runtime during installation.
  electron: true
  # electron-builder carries the Squirrel.Windows packager, but this app ships
  # NSIS only, so its Mono bootstrap script is deliberately unnecessary.
  electron-winstaller: false
  lefthook: true
  # Cross-platform boundary for the persistent PTY backend, including ConPTY on Windows.
  node-pty: true
  # Pulled in by @earendil-works/pi-ai (optional LLM API backend). pnpm lists
  # them only because they ship lifecycle scripts, but those are no-ops we don't
  # need, so we deny them — install still succeeds.
  '@google/genai': false
  protobufjs: false
  node-addon-require-builtin: false
  # JSONL durability calls MoveFileExW with write-through publication on Windows.
  koffi: true
  # The Python runtime deploy includes the reviewed workspace postinstall that
  # restores the executable bit on node-pty's macOS spawn helper.
  '@deepseek-ai/dsh-subprocess-local@file:packages/subprocess/subprocess-local': true
minimumReleaseAgeExclude:
  # Fresh pi-ai releases carry the model catalog updates that are the whole
  # point of bumping it; waiting out the release age would defeat that.
  - '@earendil-works/pi-ai@0.84.2'
  - node-addon-native-custom-loader@0.1.4
  - node-addon-require-builtin-darwin-arm64@0.1.4
  - node-addon-require-builtin-darwin-x64@0.1.4
  - node-addon-require-builtin-linux-arm64-gnu@0.1.4
  - node-addon-require-builtin-linux-x64-gnu@0.1.4
  - node-addon-require-builtin-win32-arm64-msvc@0.1.4
  - node-addon-require-builtin-win32-ia32-msvc@0.1.4
  - node-addon-require-builtin-win32-x64-msvc@0.1.4
  - node-addon-require-builtin@0.1.4
  # The active pnpm supply-chain policy blocks this reviewed runtime closure
  # until its release-age window expires unless every exact package is exempt.
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.241'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.241'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.241'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.241'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.241'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.241'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.241'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.241'
  - '@anthropic-ai/claude-agent-sdk@0.3.241'
  # All platform aliases resolve to the @openai/codex package name, so their
  # reviewed exact versions must share one version-union policy entry.
  - '@openai/codex@0.149.1||0.149.1-darwin-arm64||0.149.1-darwin-x64||0.149.1-linux-arm64||0.149.1-linux-x64||0.149.1-win32-arm64||0.149.1-win32-x64'

patchedDependencies:
  '@anysearch/anysearch-dsh@0.1.4': patches/anysearch-anysearch-dsh@0.1.4.patch
  '@dickpy/dsh-imagegen@1.5.1': patches/dickpy-dsh-imagegen@1.5.1.patch
  '@huanlin/dsh-plugin-better-sidebar-plugin-office@0.1.2': patches/huanlin-dsh-plugin-better-sidebar-plugin-office@0.1.2.patch
  '@xmanrui/dsh-im@1.0.3': patches/xmanrui-dsh-im@1.0.3.patch
  'dsh-better-sidebar@0.17.1': patches/dsh-better-sidebar@0.17.1.patch
  'dsh-plugin-cron@0.1.3': patches/dsh-plugin-cron@0.1.3.patch
  'dsh-skill-mcp-panel@2.0.1': patches/dsh-skill-mcp-panel@2.0.1.patch
  node-pty@1.2.0-beta.15: patches/node-pty@1.2.0-beta.15.patch
